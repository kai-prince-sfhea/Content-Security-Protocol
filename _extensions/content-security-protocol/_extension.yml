title: Content Security Protocol Extension
description: |
  An extension for Quarto that generates strict Content Security Protocols
  with any relaxations dependent on the webpage content.
author: Kai Prince SFHEA
version: 0.0.1
quarto-required: ">=1.7.0"
contributes:
  metadata:
    project:
      type: website
      pre-render:
        - quarto-pre/CSP-pre.lua
      post-render:
        - quarto
        - quarto-post/CSP-post.lua
      filter:
        - filters/CSP-filter.lua